name: mizo_client
description: "MIZO Voice Social Entertainment Client (Flutter + LiveKit + Yari Architecture)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  # LiveKit Official WebRTC SFU SDK
  livekit_client: ^2.1.2
  
  # State Management & DI (matching Yari & FluffyChat patterns)
  flutter_riverpod: ^2.5.1

  # Firebase Official Ecosystem
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  
  # Animation & Multimedia
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.0
  flutter_animate: ^4.5.0
  audioplayers: ^6.0.0
  
  # Networking & Sockets
  socket_io_client: ^2.0.3+1
  http: ^1.2.1
  
  # UI & Media Controls
  cached_network_image: ^3.3.1
  font_awesome_flutter: ^10.7.0
  glassmorphism: ^3.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/audio/
